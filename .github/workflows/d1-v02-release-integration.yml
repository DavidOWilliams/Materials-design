name: D1 v0.2 exact-integration-source qualification
on:
  push:
    branches: [d1-v0.2-controlled-integration-2026-10-30]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout actual candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce accepted scientific source and exact-tree allowlist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/d1-v02-release
          git rev-parse HEAD | tee /tmp/d1-v02-release/checkout-head.txt
          git rev-parse HEAD^{tree} | tee /tmp/d1-v02-release/checkout-tree.txt
          test "$(git rev-parse d9e63ea468294eba4fc25493395ad68d60edf9a5^{tree})" = "f63327ed03e7b22bb8c655c2d7ec608f0b0d7bb2"
          git diff --name-status d9e63ea468294eba4fc25493395ad68d60edf9a5 HEAD | tee /tmp/d1-v02-release/diff-from-accepted.txt
          python - <<'PY'
          import subprocess
          paths=subprocess.check_output(["git","diff","--name-only","d9e63ea468294eba4fc25493395ad68d60edf9a5","HEAD"], text=True).splitlines()
          allow={
            "foundation/D1_V02_WP3_CI_COMPATIBILITY_CORRECTION_REPORT.md",
            "foundation/D1_V02_RELEASE_NOTES.md",
            "foundation/D1_V02_RELEASE_APPROVAL_DOSSIER.md",
            "foundation/D1_V02_RELEASE_INSTALL_FIRST_USE.md",
            "foundation/D1_SOURCE_OF_TRUTH_REGISTER.md",
            "foundation/D1_INTEGRATION_MANIFEST.md",
            "foundation/PROGRAMME_DELIVERY_LEDGER.md",
            "foundation/D1_RELEASE_APPROVAL_CHECKLIST.md",
            "foundation/D1_RELEASE_FINAL_VERIFICATION_AND_APPROVAL.md",
            "foundation/D1_RELEASE_SOURCE_AND_EVIDENCE_MANIFEST.md",
            ".github/workflows/d1-v02-release-integration.yml",
          }
          assert paths and all(p in allow for p in paths),f"UNREVIEWED changes: {sorted(set(paths)-allow)}"
          print("ACCEPTED SCIENTIFIC/APPLICATION/DEPENDENCY TREE UNCHANGED; DOCS AND RELEASE-ONLY CI")
          PY
          git status --short > /tmp/d1-v02-release/git-status.txt
      - name: Clean Python 3.12 numerical and graphical installation
        shell: bash
        run: |
          set -euo pipefail
          bash foundation/setup.sh 2>&1 | tee /tmp/d1-v02-release/install.log
          .venv-foundation/bin/python -m pip install streamlit==1.40.2 playwright==1.56.0 2>&1 | tee /tmp/d1-v02-release/ui-install.log
          .venv-foundation/bin/python -m pip check | tee /tmp/d1-v02-release/pip-check.log
          .venv-foundation/bin/python -m pip freeze > /tmp/d1-v02-release/freeze.txt
          .venv-foundation/bin/python --version > /tmp/d1-v02-release/python.txt
          .venv-foundation/bin/python -m playwright install --with-deps chromium > /tmp/d1-v02-release/chromium-install.log 2>&1
      - name: Scientific graphs and source-data encoding challenges
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=foundation .venv-foundation/bin/python -m unittest foundation.tests.test_d1_visuals -v 2>&1 | tee /tmp/d1-v02-release/visual-tests.log
          PYTHONPATH=foundation .venv-foundation/bin/python -m pytest foundation/tests -q --tb=long 2>&1 | tee /tmp/d1-v02-release/foundation-tests.log
          PYTHONPATH=foundation .venv-foundation/bin/python -m pytest foundation/ui_tests/test_d1_v02_ui_collision.py -v --tb=long 2>&1 | tee /tmp/d1-v02-release/relocated-ui-tests.log
      - name: Prove v0.1.0 vs v0.2 numerical outcome identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/tags/d1-v0.1.0:refs/tags/d1-v0.1.0
          test "$(git rev-parse refs/tags/d1-v0.1.0^{commit})" = "ec4bea044858bc275a1be80c3df24be438085279"
          git worktree add --detach /tmp/d1-v01-release-comparison refs/tags/d1-v0.1.0
          PYTHONPATH=foundation .venv-foundation/bin/python foundation/tests/d1_v02_compare_baseline.py /tmp/d1-v01-release-comparison /tmp/d1-v02-release/baseline-comparison 2>&1 | tee /tmp/d1-v02-release/baseline-comparison.log
      - name: Full resolution WP3 and WP4 dossiers with separate-process replay
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=foundation .venv-foundation/bin/python foundation/wp7_create_examples.py /tmp/d1-v02-release/example-dossiers --elements 4096 --budget 9 2>&1 | tee /tmp/d1-v02-release/example-replay.log
          test -s /tmp/d1-v02-release/example-dossiers/example-manifest.json
      - name: Actual Chromium first-user journey and handoff recovery
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=foundation .venv-foundation/bin/python -m streamlit run foundation/wp7_app.py --server.headless true --server.port 8512 > /tmp/d1-v02-release/streamlit.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8512/_stcore/health > /tmp/d1-v02-release/health.txt 2>/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          D1_V02_BROWSER_WORKSPACE=/tmp/d1-v02-release/browser PYTHONPATH=foundation .venv-foundation/bin/python foundation/tests/d1_v02_browser_challenge.py 2>&1 | tee /tmp/d1-v02-release/browser-first-user.log
          D1_BROWSER_BASE_URL=http://127.0.0.1:8512 WP7_IR_BROWSER_WORKSPACE=/tmp/d1-v02-release/browser-handoff PYTHONPATH=foundation .venv-foundation/bin/python foundation/tests/wp7_ir_browser_acceptance.py 2>&1 | tee /tmp/d1-v02-release/browser-handoff.log
      - name: Fail closed on evidence archive and manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/d1-v02-release
          test -s checkout-head.txt
          test -s diff-from-accepted.txt
          test -s example-dossiers/example-manifest.json
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          test -s SHA256SUMS
          sha256sum -c SHA256SUMS > integrity-check.log
      - name: Preserve evidence on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-v02-controlled-integration-evidence
          path: /tmp/d1-v02-release/
          if-no-files-found: warn
          retention-days: 90
