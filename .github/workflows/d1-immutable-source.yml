name: D1 immutable WP6 source verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout immutable accepted implementation
        uses: actions/checkout@v4
        with:
          ref: 1f89c2d1bf64b669ca98b81f4305d20d08104e5c
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clean environment and immutable source assertion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/d1-evidence"
          exec > >(tee "$RUNNER_TEMP/d1-evidence/setup.log") 2>&1
          test "$(git rev-parse HEAD)" = "1f89c2d1bf64b669ca98b81f4305d20d08104e5c"
          git rev-parse HEAD | tee "$RUNNER_TEMP/d1-evidence/implementation-sha.txt"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/d1-evidence/workflow-event-sha.txt"
          python --version
          bash foundation/setup.sh
          .venv-foundation/bin/python -m pip check
          .venv-foundation/bin/python -m pip freeze > "$RUNNER_TEMP/d1-evidence/dependencies.txt"
      - name: Foundation and recovery regressions (WP1–WP6)
        shell: bash
        run: |
          set -euo pipefail
          .venv-foundation/bin/python -m pip install streamlit==1.40.2
          PYTHONPATH=.:foundation .venv-foundation/bin/python -m pytest foundation/tests recovered_wp0 -vv --tb=long 2>&1 | tee "$RUNNER_TEMP/d1-evidence/regressions.log"
      - name: WP6 evaluation and no-artifact regression
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=.:foundation .venv-foundation/bin/python -m pytest foundation/tests/test_wp6_evaluation.py foundation/tests/test_wp6_g2_02_reproduction.py -vv --tb=long 2>&1 | tee "$RUNNER_TEMP/d1-evidence/wp6-tests.log"
          PYTHONPATH=.:foundation .venv-foundation/bin/python foundation/wp6/gate2_challenges.py "$RUNNER_TEMP/d1-evidence/wp6-gate2" 2>&1 | tee "$RUNNER_TEMP/d1-evidence/wp6-gate2.log"
      - name: Repository evidence manifests
        shell: bash
        run: |
          set -euo pipefail
          find foundation -type f \( -name SHA256SUMS -o -name SHA256SUMS.txt \) -print | sort | tee "$RUNNER_TEMP/d1-evidence/manifests.txt"
          while IFS= read -r file; do
            (cd "$(dirname "$file")" && sha256sum -c "$(basename "$file")")
          done < "$RUNNER_TEMP/d1-evidence/manifests.txt" 2>&1 | tee "$RUNNER_TEMP/d1-evidence/manifests-check.log"
      - name: Archive results and SHA256
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/d1-evidence"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
      - name: Upload results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-wp6-immutable-source-evidence
          path: ${{ runner.temp }}/d1-evidence/
          if-no-files-found: warn
          retention-days: 90
